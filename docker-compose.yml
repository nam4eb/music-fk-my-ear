services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibebox
      POSTGRES_USER: vibebox
      POSTGRES_PASSWORD: vibebox_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vibebox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibebox -d vibebox"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  vibebox_pgdata:
