name: Deploy VibeBox Next static export to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Test recommendation engine
        run: npm test
      - name: Build core package
        run: npm run build:core
      - name: Build Next static site
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_PATH: /vibebox
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then echo 'Set GitHub repo variable NEXT_PUBLIC_API_URL before deploy'; exit 1; fi
          npm run build:web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
